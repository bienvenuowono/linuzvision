<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_38 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_38" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_38');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const container = document.getElementById('threejs-container');
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Shield/Protection geometry - a sophisticated wireframe shell
const geometry = new THREE.IcosahedronGeometry(2, 2);
const material = new THREE.MeshPhongMaterial({
    color: 0x2B2B2B,
    wireframe: true,
    transparent: true,
    opacity: 0.2,
    shininess: 100
});
const shield = new THREE.Mesh(geometry, material);
scene.add(shield);

// Core "Business Asset" - solid geometric core
const coreGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
const coreMat = new THREE.MeshPhongMaterial({ color: 0x2B2B2B });
const core = new THREE.Mesh(coreGeo, coreMat);
scene.add(core);

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);
const pointLight = new THREE.PointLight(0xffffff, 1);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

camera.position.z = 5;

function animate(t) {
    requestAnimationFrame(animate);
    
    shield.rotation.y += 0.002;
    shield.rotation.x += 0.001;
    
    core.rotation.y -= 0.005;
    core.rotation.z += 0.003;
    
    // Scale pulse for the shield
    const scale = 1.0 + Math.sin(t * 0.001) * 0.05;
    shield.scale.set(scale, scale, scale);

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
});

animate(0);
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_38 -->
</body>
</html>
