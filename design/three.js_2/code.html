<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_44 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_44" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_44');
  const devicePixelRatio = window.devicePixelRatio || 1;
  (function() {
  const container = document.getElementById('threejs-container');
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // Africa ↔ America Bridge Visualization
  // Two main nodes with connecting data arcs
  const group = new THREE.Group();
  scene.add(group);

  const nodeGeo = new THREE.IcosahedronGeometry(0.5, 2);
  const nodeMat = new THREE.MeshPhongMaterial({ color: 0x2B2B2B, wireframe: true });
  
  const nodeA = new THREE.Mesh(nodeGeo, nodeMat);
  nodeA.position.x = -2.5;
  group.add(nodeA);

  const nodeB = new THREE.Mesh(nodeGeo, nodeMat);
  nodeB.position.x = 2.5;
  group.add(nodeB);

  // Arcs
  const createArc = (start, end, height, opacity) => {
    const points = [];
    for (let i = 0; i <= 20; i++) {
      const t = i / 20;
      const x = start.x + (end.x - start.x) * t;
      const y = Math.sin(t * Math.PI) * height;
      const z = Math.cos(t * Math.PI) * 0.5;
      points.push(new THREE.Vector3(x, y, z));
    }
    const curve = new THREE.CatmullRomCurve3(points);
    const geo = new THREE.TubeGeometry(curve, 20, 0.02, 8, false);
    const mat = new THREE.MeshBasicMaterial({ color: 0x2B2B2B, transparent: true, opacity });
    return new THREE.Mesh(geo, mat);
  };

  group.add(createArc(nodeA.position, nodeB.position, 1.5, 0.3));
  group.add(createArc(nodeA.position, nodeB.position, -1.2, 0.2));
  group.add(createArc(nodeA.position, nodeB.position, 0.8, 0.4));

  // Lights
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);
  const pointLight = new THREE.PointLight(0xffffff, 1);
  pointLight.position.set(5, 5, 5);
  scene.add(pointLight);

  camera.position.z = 6;

  function animate(t) {
    requestAnimationFrame(animate);
    group.rotation.y += 0.002;
    nodeA.rotation.y += 0.01;
    nodeB.rotation.y += 0.01;
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  });

  animate(0);
})();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_44 -->
</body>
</html>
